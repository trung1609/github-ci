# =========================================================
# Grafana Datasource Provisioning
# Tự động kết nối Grafana với Prometheus khi khởi động
# =========================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "10s"
      httpMethod: POST
