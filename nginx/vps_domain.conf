# Cấu hình Nginx cho VPS (chỉ chứa block Server)
# File này thường được đặt tại: /etc/nginx/conf.d/your-domain.conf 
# hoặc /etc/nginx/sites-available/your-domain

# ---------------------------------------------------------
# HTTPS Server
# ---------------------------------------------------------
server {
    listen 443 ssl;
    server_name hunghx-rikkei.duckdns.org;

    # Đường dẫn tới file SSL thực tế trên VPS (ví dụ dùng Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # =====================================================
    # 1. Location cho User Service (Spring Boot API)
    # =====================================================
    location / {
        # Trỏ thẳng vào port 8080 của host VPS (nơi Docker expose)
        proxy_pass http://127.0.0.1:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================================
    # 2. Location cho Grafana Dashboard
    # =====================================================
    location /grafana/ {
        # Cách 1: Nginx cắt bỏ /grafana/ trước khi gửi đến container
        # Dấu '/' ở cuối http://127.0.0.1:3000/ cực kỳ quan trọng!
        proxy_pass http://127.0.0.1:3000/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================================
    # 3. Location cho Grafana WebSocket (Live Updates)
    # =====================================================
    location /grafana/api/live/ {
        proxy_pass http://127.0.0.1:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
