# =========================================================
# nginx.conf - Reverse Proxy với SSL
# =========================================================
# Routing trên cùng domain:
#   /              → User Service (Spring Boot API)
#   /grafana/      → Grafana Dashboard
# =========================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml;

    # ---------------------------------------------------------
    # Upstream: Định nghĩa các backend services
    # ---------------------------------------------------------
    upstream user_service {
        # Nếu Nginx chạy trực tiếp trên VPS (không qua Docker), 
        # phải dùng 127.0.0.1 thay vì tên service Docker
        server 127.0.0.1:8080;
    }

    upstream grafana {
        server 127.0.0.1:3000;
    }

    # ---------------------------------------------------------
    # HTTP → Redirect HTTPS
    # ---------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------
    # HTTPS (SSL)
    # ---------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        # =====================================================
        # SSL Certificate (thay đường dẫn theo VPS thực tế)
        # =====================================================
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # =====================================================
        # Location: User Service (Spring Boot API)
        # https://your-domain.com/
        # =====================================================
        location / {
            proxy_pass http://user_service;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # =====================================================
        # Location: Grafana Dashboard
        # https://your-domain.com/grafana/
        # =====================================================
        # Yêu cầu Grafana phải cấu hình:
        #   GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
        #   GF_SERVER_SERVE_FROM_SUB_PATH=true
        # =====================================================
        location /grafana/ {
            proxy_pass http://grafana;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana WebSocket (Live features, notifications)
        location /grafana/api/live/ {
            proxy_pass http://grafana;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # =====================================================
        # Health Check Nginx
        # =====================================================
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
