name: CI/CD Pipeline UserService

on:
  push:
    branches: ["main","dev"]
    tags: ["v*.*.*"] # khớp với cac git tag v1.1.0 chẳng hạn
  pull_request:
    branches: ["main"]

  # Thiết lập biến môi trường
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
# CI - CD
# CI : Biên dịch, kiểm thử, kieemr tra chất lượng code
# CD : docker build image , push image ln registry,[deploy image lên server]
jobs:
  ci:
    name: "Build and Test"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
      - name: "Setup JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: "Compile and run unit test"
        run: mvn -B clean test --file pom.xml
      - name: "Lưu file test"
        uses: actions/upload-artifact@v4
        if: always()
        with:
            name: "test-report"
            path: "/target/surefire-reports"
            retention-days: 30
      - name: "Packing Jar File"
        run: mvn -B package -DskipTests --file pom.xml
      - name: "Upload Jar Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "app.jar"
          path: "target/user-service.jar"
          retention-days: 7
  cd:
    name : "Docker Build and Push"
    runs-on: "ubuntu-latest"
    needs: ci
    if: github.event_name == 'push'

    # Quyền read and write lên GHCR
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up docker buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # an toàn khi sử dụng token

      - name: "Build tag and label for image"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: "Build and push image"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max